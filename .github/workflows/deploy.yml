name: Deploy Joy Credits Corner

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Prepare Pages artifact
        run: |
          mkdir -p pages
          cp -R .output/public/. pages/

          JS_FILE=$(find pages/assets -maxdepth 1 -type f -name 'index-*.js' | head -n 1)
          CSS_FILE=$(find pages/assets -maxdepth 1 -type f -name '*.css' | head -n 1)

          if [ -z "$JS_FILE" ] || [ -z "$CSS_FILE" ]; then
            echo "Could not find built JS/CSS assets"
            exit 1
          fi

          JS_NAME=$(basename "$JS_FILE")
          CSS_NAME=$(basename "$CSS_FILE")

          cat > pages/index.html <<EOF
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Robux Packages — Demo</title>
              <link rel="stylesheet" href="/joy-credits-corner/assets/$CSS_NAME" />
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/joy-credits-corner/assets/$JS_NAME"></script>
            </body>
          </html>
          EOF

          touch pages/.nojekyll

      - name: Inspect Pages output
        run: |
          echo "=== Pages output ==="
          find pages -maxdepth 4 -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./pages

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
